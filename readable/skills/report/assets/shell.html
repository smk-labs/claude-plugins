<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{KIT}}
</style>
<style>
/* The palette is assets/palette.css, injected here: the card, the report and the
   email transform all paint with one set of values (6.7.0). */
{{PALETTE}}
html,body{margin:0;background:var(--page-bg)}
/* A @TABS bar jumps as a plain anchor, so the animation that says "you moved inside this same
   document" is one stylesheet line instead of a click handler — nothing to wire, and it still
   works with the scrollspy script stripped out. scroll-behavior does not honour reduced motion
   on its own, so that is spelled here. */
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.wrap{max-width:860px;margin:0 auto;padding:34px 16px 20px}
.rc{font-size:13.5px;padding:2rem 2.4rem;border-radius:16px;margin:0}
.meta{color:var(--text-secondary);font-family:inherit;font-size:11.5px;margin:10px 4px 0;text-align:end;font-family:Vazirmatn,Inter,Tahoma,sans-serif}
.theme-toggle{position:fixed;top:16px;inset-inline-end:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:linear-gradient(90deg,var(--surface-1) 50%,var(--text-primary) 50%);cursor:pointer;padding:0}
.theme-toggle:hover{border-color:var(--text-accent)}
/* Copy + PDF: the two one-click actions, on the inline-START corner (opposite the theme toggle + menu on the end corner). PDF prints the rendered page — a standalone report is a real document, so the browser's Save as PDF is exact. */
.rbar{position:fixed;top:16px;inset-inline-start:16px;display:flex;gap:6px;z-index:9}
.rbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rbar button:hover{border-color:var(--text-accent);color:var(--text-accent)}
.rbar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbar button.ok{color:var(--text-accent);border-color:var(--text-accent)}
/* The shared menu (assets/menu.js) installs itself on the card's own end corner at 8px; in a report it belongs beside the theme toggle, one toggle-width in (16+34+12). The toggle follows the ROOT dir, so the menu's side is read from <html dir> here, not from menu.js's #card sibling rule (#card is nested in .wrap, so that rule never matches in a report). Higher specificity than menu.js's #rcmenu rules, so it wins whichever <style> is appended last. */
html[dir=ltr] #rcmenu{top:16px;right:62px}
html[dir=rtl] #rcmenu{top:16px;left:62px;right:auto}
html[dir=rtl] #rcmenu .items{left:0;right:auto}
/* IMG_FIT: a screenshot must never be wider than the column, on screen or
   on paper. Unconstrained, it widens the layout and clips the text. */
@page{margin:15mm 14mm}
@media print{
.theme-toggle,.rbar,#rcmenu,#rctoast,#rccp{display:none}
html,body{background:#fff}
.rc{border:none;padding:0}
.wrap{max-width:none;padding:0}
/* Browsers drop every background in print unless told otherwise, which is what
   strips the palette, the callouts, the badges and the table stripes. */
*{print-color-adjust:exact;-webkit-print-color-adjust:exact}
/* Keep a heading with what it introduces, and never split a self-contained
   block across a page. */
h2,h3{break-after:avoid;page-break-after:avoid}
h2,h3,p,li{orphans:3;widows:3}
.cal,.kpi,.kv>div,.bar,.spark,.donut,.tl>div,.flow,blockquote,pre,tr,img,svg,figure{break-inside:avoid;page-break-inside:avoid}
thead{display:table-header-group}
tfoot{display:table-footer-group}
/* A long table should still be allowed to flow onto the next page. */
table,.grid,.bars,.scroll-table{break-inside:auto;page-break-inside:auto}
a{text-decoration:none}
/* On paper the sheet IS the surface. The screen card is a panel floating on a
   page background; printed, that panel ends wherever the content ends and the
   rest of the sheet stays raw white, so every page breaks into a coloured block
   over a white strip. Drop the panel entirely and let the text sit on the paper.
   Semantic fills (callouts, badges, table stripes) are untouched and still
   print, because print-color-adjust above keeps them. */
html,body{background:#fff !important}
/* Report-only half of the figure rules: the kit's @FIG owns the screen look, this caps an
   image to one page and squares the corners for paper. */
.rc img{max-width:100% !important;max-height:140mm;width:auto;height:auto;border-radius:0}
.wrap,.rc,.brand,.meta{background:none !important;box-shadow:none !important;border:none !important;border-radius:0 !important}
}
</style>
<style>
{{EXTRA}}
</style>
<style>
{{BRAND}}
</style>
</head>
<body>
<button class="theme-toggle" title="light / dark" onclick="(function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('report-theme',r.getAttribute('data-theme'))}catch(e){}})()"></button>
<div class="rbar">
<button id="rbcopy" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
<button id="rbpdf" title="Print / Save as PDF"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v6H8z"/></svg></button>
</div>
<script>try{var t=localStorage.getItem('report-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script>/* Paper is white, so a report always prints in the light palette no matter
   what the reader is viewing on screen. Without this, print-color-adjust:exact
   faithfully reproduces the dark theme and the page comes out a black slab.
   Restores the reader's own theme afterwards. */
(function(){var r=document.documentElement,prev=null;
function before(){prev=r.getAttribute('data-theme');r.setAttribute('data-theme','light')}
function after(){if(prev===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',prev);prev=null}
window.addEventListener('beforeprint',before);window.addEventListener('afterprint',after);
if(window.matchMedia){var m=window.matchMedia('print');if(m.addEventListener)m.addEventListener('change',function(e){e.matches?before():after()})}})()</script>
<div class="wrap">
{{BRANDHEAD}}<div class="rc" id="card">
{{CONTENT}}
</div>
<div class="meta">{{DATE}}</div>
</div>
<script>
{{MENU}}
</script>
<script>
{{EMAIL}}
</script>
<script>
/* Email adapter for the shared menu (assets/menu.js). A standalone report has
   no MCP server to call, so it inlines assets/email.js — THE transform, the
   same one the card's render_email tool runs — and only has to hand it the two
   things the file cannot know: the direction, and the palette this report is
   actually wearing.

   Before 5.4.0 the report had its OWN getComputedStyle walker here and the two
   paths drifted: it kept <svg>, flattened grid to a stacked block, and never
   built a table, so a KPI row that read as a dashboard on screen pasted into
   Outlook as a run of naked numbers.

   The palette is read off the live card rather than off the brand file, so
   whatever cascade produced the look on screen produces it in the mail. Read
   under the LIGHT theme (mail is white paper), then the reader's theme is put
   back. Values that are still var() or color-mix() are left out on purpose —
   the transform resolves those itself, and neither survives an email client. */
window.__rcEmail = function (cb) {
  var NAMES = ['--text-primary', '--text-secondary', '--text-accent', '--surface-1', '--surface-2', '--border', '--border-strong', '--bg-success', '--bg-accent', '--bg-warning', '--bg-danger', '--ca', '--cb', '--cc', '--cd'];
  var root = document.documentElement, prev = root.getAttribute('data-theme');
  root.setAttribute('data-theme', 'light');
  try {
    var card = document.getElementById('card'), cs = getComputedStyle(card), vars = '';
    for (var i = 0; i < NAMES.length; i++) {
      var v = cs.getPropertyValue(NAMES[i]).trim();
      if (v) vars += NAMES[i] + ':' + v + ';';
    }
    cb(window.__rcEmailRender(card.innerHTML, {
      theme: 'light',
      brand: ':root{' + vars + '}',
      dir: cs.direction === 'rtl' ? 'rtl' : 'ltr',
    }), null);
  } catch (e) {
    cb(null, String(e && e.message));
  } finally {
    if (prev) root.setAttribute('data-theme', prev); else root.removeAttribute('data-theme');
  }
};
/* Copy + PDF one-click buttons. Copy reuses the menu's clipText bridge
   (window.__rcCopy) so the report's copy path is identical to the menu's;
   PDF is just the browser print dialog on this real, standalone page. */
(function () {
  var card = document.getElementById('card');
  var cp = document.getElementById('rbcopy'), pdf = document.getElementById('rbpdf');
  if (cp) cp.addEventListener('click', function () {
    (window.__rcCopy || function (t, cb) { navigator.clipboard.writeText(t).then(function () { cb(true) }, function () { cb(false) }) })(card.innerText, function (ok) {
      if (!ok) return; cp.classList.add('ok'); setTimeout(function () { cp.classList.remove('ok') }, 1600);
    });
  });
  if (pdf) pdf.addEventListener('click', function () { window.print() });
})();
/* @TABS scrollspy — the ONLY script the component needs. The bar, the jump and
   the landing offset are all CSS, so a report keeps working with this file
   stripped; this adds the follow-on-scroll highlight and nothing else. Guarded
   on the bar existing, so a report without one runs no code at all. */
(function () {
  var card = document.getElementById('card');
  var bar = card && card.querySelector('.tabs');
  if (!bar) return;
  var items = [];
  bar.querySelectorAll('a[href^="#"]').forEach(function (a) {
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (el) items.push({ a: a, el: el });
  });
  if (items.length < 2) return;

  /* The bar's own height is the offset for everything else: the line the
     scrollspy compares against, and how far a heading has to clear itself when
     it is jumped to (--tabh, which the kit reads for scroll-margin-top).
     MEASURED, never hardcoded. The bar wraps — six tabs on a phone are three
     flex lines — and a fixed offset then parks the heading behind rows two and
     three of the bar that just moved it there. The sticky offset is read off the
     bar too, so the 10px in the stylesheet is not spelled a second time here.
     A ResizeObserver and not a resize listener: the webfont lands AFTER first
     paint and changes the bar's height with no resize event to hear. */
  var line = 0;
  function measure() {
    var top = parseFloat(getComputedStyle(bar).top) || 0;
    var h = bar.getBoundingClientRect().height + top;
    card.style.setProperty('--tabh', Math.round(h + 22) + 'px');
    line = h + 24;
  }

  /* The active tab is the LAST section whose heading has passed the line just
     under the bar. Comparing against that line rather than the viewport top is
     what keeps a tab lit while its own body is still on screen.
     Called STRAIGHT from the scroll handler, never through
     requestAnimationFrame: rAF is throttled to zero in a background or hidden
     tab, so the bar freezes on whatever was active when the tab lost focus and
     is wrong the moment the reader comes back. A handful of rects per event is
     cheap enough not to want the throttle. */
  function sync() {
    var on = 0;
    for (var i = 0; i < items.length; i++) {
      if (items[i].el.getBoundingClientRect().top <= line) on = i;
    }
    items.forEach(function (it, i) {
      if (i === on) it.a.setAttribute('aria-current', 'location');
      else it.a.removeAttribute('aria-current');
    });
  }

  function hold() { measure(); sync(); }
  window.addEventListener('scroll', sync, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(hold).observe(bar);
  else window.addEventListener('resize', hold, { passive: true });
  hold();
})();
/* PNG export inlines the font bytes (an SVG-as-image can't load an external
   @import font, so it would otherwise rasterize in a system fallback). The
   report has no MCP server, so it embeds client-side: fetch every @import
   sheet, swap each gstatic url for a data: URI, mount as #rcfont. menu.js's
   ensureFonts then finds #rcfont and keeps it in the export. Best-effort:
   any failure just leaves the system-font fallback.

   The same rule binds every INLINED FIGURE, which is also an svg-as-image, and
   for two releases nothing acted on it: figure text sat in a system serif beside
   a Vazirmatn paragraph. build.py's figure_font now folds the report's face into
   the lifted svg at BUILD time (subset to the characters that figure letters, so
   it costs a few KB rather than the whole family). Two paths, one reason. */
(function () {
  var imports = [];
  document.querySelectorAll('style').forEach(function (s) {
    (s.textContent.match(/@import url\((?:['"]?)([^'")]+)(?:['"]?)\)/g) || []).forEach(function (m) {
      var u = m.replace(/@import url\((?:['"]?)|(?:['"]?)\)$/g, '');
      if (imports.indexOf(u) < 0) imports.push(u);
    });
  });
  if (!imports.length) return;
  var SUBSETS = ['arabic', 'latin', 'latin-ext'];
  function toData(url) {
    return fetch(url).then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) {
      if (!b) return null;
      return new Promise(function (res) { var f = new FileReader(); f.onload = function () { res(f.result) }; f.onerror = function () { res(null) }; f.readAsDataURL(b); });
    }).catch(function () { return null; });
  }
  Promise.all(imports.map(function (u) { return fetch(u).then(function (r) { return r.ok ? r.text() : '' }).catch(function () { return '' }); })).then(function (sheets) {
    var faces = [];
    sheets.join('\n').replace(/(?:\/\*\s*([\w-]+)\s*\*\/\s*)?@font-face\s*\{([^}]*)\}/g, function (_, subset, body) {
      if (subset && SUBSETS.indexOf(subset) < 0) return _;
      var um = body.match(/url\((https:\/\/[^)]+\.woff2)\)/);
      if (um) faces.push({ body: body, url: um[1] });
      return _;
    });
    return Promise.all(faces.map(function (f) { return toData(f.url).then(function (d) { return d ? '@font-face{' + f.body.replace(f.url, d) + '}' : '' }); }));
  }).then(function (rules) {
    var css = rules.filter(Boolean).join('');
    if (!css || document.getElementById('rcfont')) return;
    var s = document.createElement('style'); s.id = 'rcfont'; s.textContent = css; document.head.appendChild(s);
  }).catch(function () {});
})();
</script>
</body>
</html>
